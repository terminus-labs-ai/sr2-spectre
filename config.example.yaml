# SR2 Spectre — example configuration
#
# Copy this file, fill in your values, and pass it to sr2-spectre:
#   sr2-spectre my-config.yaml --plugin tui

# Agent-level settings
agent:
  name: my-agent

  # Built-in tools to register. Each tool is a Python class loaded by class_path.
  # Remove tools you don't want, or add custom ones.
  tools:
    - name: terminal
      class_path: sr2_spectre.tools.builtins.terminal.TerminalTool
      config:
        timeout: 30           # seconds before command is killed

    - name: file_read
      class_path: sr2_spectre.tools.builtins.file_read.FileReadTool
      config:
        max_bytes: 1000000    # refuse files larger than this

    - name: file_write
      class_path: sr2_spectre.tools.builtins.file_write.FileWriteTool

    # Uncomment to enable web search via a SearXNG instance
    # - name: web_search
    #   class_path: sr2_spectre.tools.builtins.web_search.WebSearchTool
    #   config:
    #     base_url: http://localhost:8080   # your SearXNG URL
    #     max_results: 5

    # Planning: verify-gated task completion (requires PlanResolver in pipeline)
    # - name: complete_step
    #   class_path: sr2_spectre.tools.builtins.complete_step.CompleteStepTool
    #   config:
    #     plans_root: ~/.sr2/plans   # optional; defaults to ~/.sr2/plans

# LLM endpoints. "default" is required. Additional named endpoints are optional.
models:
  default:
    model: openai/YOUR_MODEL_NAME   # e.g. openai/gpt-4o, anthropic/claude-opus-4-7
    base_url: http://localhost:11434/v1  # omit for hosted APIs (OpenAI, Anthropic)

# SR2 pipeline — context compilation, token budgets, layers
pipeline:
  token_budget: 200000
  max_tool_iterations: 40   # max LLM → tool → LLM cycles per turn (SR2 enforces this)

  layers:
    # System prompt layer
    - name: system
      target: system
      resolvers:
        - type: static
          config:
            text: |
              You are a helpful AI assistant with access to tools.
              Use them when they would help answer the user's question.

    # Tool definitions layer — injects available tools into context
    - name: tools
      target: tools
      resolvers: []
      tool_providers:
        - type: spectre_tools

    # Conversation history layer
    - name: conversation
      target: messages
      resolvers:
        - type: session   # prior turns from this session
        - type: input     # current user message

# Zulip interface (--interface zulip) — see docs/CONFIG-REFERENCE.md
# zulip:
#   zuliprc: ~/.sr2/secrets/zulip/miranda.zuliprc   # bot credentials; never inline
#   mode: stream            # default; only stream or direct are accepted
#   peer_id: null           # direct requires an unquoted integer user ID; missing/null fails startup
#                           # strings, booleans and floats are rejected; ignored in stream mode
#   users: []               # integer user IDs that may trigger a turn; empty = any human
#   mention_only: false     # stream mode: a new topic starts only on @**<bot name>**
#   channels: []            # integer channel IDs; empty = every channel the queue delivers
#   channel_areas:          # string channel ID -> area; "" = no area; else the channel name
#     "2": ""
#   # working indicator (stream mode): placeholder, then the answer by edit
#   max_message_length: 10000                    # longer answers are chunked
#   thinking_message: "⏳ Thinking..."            # posted before the model call
#   empty_response_message: "(No response generated)"
#   error_message: "Error: {error}"              # {error} = the model error text
#   edit_stream_interval: 1.0                    # min seconds between text-progress edits; 0 = off
#   tool_embed_enabled: true                     # show a line per tool start/result
#   tool_line_max_chars: 80                      # {input}/{content} cut to this + "..."
#   tool_start_line: "▶ `{name}` - `{input}`"
#   tool_result_ok_line: "✓ `{name}` - `{content}`"     # newlines in {content} become |
#   tool_result_error_line: "✖ `{name}` - `{content}`"

# Direct-mode alternative: replace the Zulip block above; --interface zulip selects it.
# Example peer 8 is a placeholder: use the intended human's user ID.
# zulip:
#   zuliprc: ~/.sr2/secrets/zulip/miranda.zuliprc
#   mode: direct
#   peer_id: 8
#   users: [8]              # nonempty must include peer_id; empty still admits only that peer
# Direct mode rejects stream posts and bot senders; no topics or area routing.
# It ignores mention_only, channels, channel_areas and the working-indicator fields.
